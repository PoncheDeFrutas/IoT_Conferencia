[project]
name = "iot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ponche", email = "josueguevara792@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "paho-mqtt>=2.1.0",
    "rpi-gpio>=0.7.1",
]

[project.scripts]
iot = "iot:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ty>=0.0.84",
]
